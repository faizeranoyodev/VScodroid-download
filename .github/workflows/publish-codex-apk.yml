name: Publish Codex screenshot paste fix APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-codex-apk.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: codex-paste-fix-test
    steps:
      - name: Download verified APK
        run: |
          curl --fail --location --retry 3 --output VSCodroid-codex-paste-fix.apk https://github.com/faizeranoyodev/VSCodroid/releases/download/codex-paste-fix-test/VSCodroid-codex-paste-fix.apk
          echo 'cc04959d7ce0ee9b83d7511075569796e8d3a0374f8e7fef5328bc9fe233a9db  VSCodroid-codex-paste-fix.apk' > SHA256SUMS
          sha256sum --check SHA256SUMS
          zip VSCodroid-codex-paste-fix-install.zip VSCodroid-codex-paste-fix.apk
          sha256sum VSCodroid-codex-paste-fix-install.zip >> SHA256SUMS
      - name: Publish download files
        run: |
          cat > NOTES.md <<'NOTES'
          Unofficial VSCodroid keyboard screenshot paste crash fix.
          
          Fixes the Android 14 crash where keyboard image commits called WebView.getUrl and evaluateJavascript from InputConnectionHandlerThread. All WebView operations now dispatch to the main thread; URI image reading stays on the bounded background worker. Queued commits check the view's destruction and localhost URL before accessing it.

          Version code 19; separate package com.vscodroid.codexpaste. Force-stop old VSCodroid apps, install this APK, and use the installer's Open button. Previous apps and their data remain installed. The separate app needs Codex extension 26.908.40401 and sign-in; disable extension auto-updates.

          Retains the stable Codex 0.162.1 backend/model catalog, the Android gallery picker, image paste routing and Codex startup compatibility fixes. Requires Android 13+ and ARM64.

          Checks: APK build, unit tests, instrumented-test compilation, lint, exact binary/image/patch digests, ZIP integrity, APK signature and ARM64 backend protocol smoke checks. The new real-WebView regression tests are compiled but require a device to execute. Keyboard screenshot paste and signed-in chat still need your phone test.

          Source: https://github.com/faizeranoyodev/VSCodroid/tree/8950b3a592dadacacf364fa0e429d990748c66ff
          Original project: https://github.com/rmyndharis/VSCodroid

          Download the ZIP alternative if the browser blocks APK downloads.
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" VSCodroid-codex-paste-fix.apk VSCodroid-codex-paste-fix-install.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" VSCodroid-codex-paste-fix.apk VSCodroid-codex-paste-fix-install.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'VSCodroid keyboard screenshot paste crash fix' --notes-file NOTES.md --prerelease
          fi
