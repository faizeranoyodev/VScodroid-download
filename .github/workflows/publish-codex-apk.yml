name: Publish Codex image input APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-codex-apk.yml']
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: codex-images-test
    steps:
      - name: Download verified APK
        run: |
          curl --fail --location --retry 3 --output VSCodroid-codex-images.apk https://github.com/faizeranoyodev/VSCodroid/releases/download/codex-images-test/VSCodroid-codex-images.apk
          echo 'aa565f3c7ca6fdabe152bb38ebd788cd01522b7c09d9202104e25f23e5c120ae  VSCodroid-codex-images.apk' > SHA256SUMS
          sha256sum --check SHA256SUMS
          zip VSCodroid-codex-images-install.zip VSCodroid-codex-images.apk
          sha256sum VSCodroid-codex-images-install.zip >> SHA256SUMS
      - name: Publish download files
        run: |
          cat > NOTES.md <<'NOTES'
          Unofficial VSCodroid Codex image input test APK.

          1. Force-stop your previous VSCodroid app and install this APK. Use the installer's Open button to open the new test app. It installs separately as `com.vscodroid.codeximages`, preserving the previous app and its data.
          2. Install Codex extension **26.908.40401**, disable its automatic updates, and sign in.
          3. In a Codex chat, use + to choose an image/file from Android storage. Tap the composer before inserting an image from Gboard's clipboard tiles.

          Codex attachments now use Android's document picker. Images committed by the keyboard are delivered as file paste events through focused extension frames. PNG, JPEG, GIF and WebP are supported; files are limited to 20 MB.
          Keeps the working Codex startup fixes. This build does not add models missing from your account/client's backend catalog.

          Requires Android 13+ and ARM64. Build, unit tests, lint, exact code/patch/backend hashes, APK signature/integrity, and ARM64 Linux backend initialization checks passed. Image selection and keyboard insertion still need testing on your Android device.

          If your browser blocks APK downloads, download the ZIP and extract it first. Checksums are in SHA256SUMS.

          Source: https://github.com/faizeranoyodev/VSCodroid/tree/1a48c4dba066d2ea6a24e111cdc1d0dfeae600cf
          Original project: https://github.com/rmyndharis/VSCodroid
          NOTES
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" VSCodroid-codex-images.apk VSCodroid-codex-images-install.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" VSCodroid-codex-images.apk VSCodroid-codex-images-install.zip SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title 'VSCodroid Codex image input test APK' --notes-file NOTES.md --prerelease
          fi
