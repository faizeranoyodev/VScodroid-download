name: Keep only latest working APK
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-codex-apk.yml']
permissions:
  contents: read
jobs:
  maintain-download:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: codex-paste-fix-test
    steps:
      - name: Verify retained APK before removing older downloads
        run: |
          test "$GITHUB_REPOSITORY" = 'faizeranoyodev/VScodroid-download'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern VSCodroid-codex-paste-fix.apk --dir verified
          echo 'cc04959d7ce0ee9b83d7511075569796e8d3a0374f8e7fef5328bc9fe233a9db  verified/VSCodroid-codex-paste-fix.apk' | sha256sum --check
      - name: Keep one release and one APK
        run: |
          for tag in image-fix-test codex-startup-test codex-images-test codex-models-test; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          for asset in VSCodroid-codex-paste-fix-install.zip SHA256SUMS; do
            if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$asset"; then
              gh release delete-asset "$RELEASE_TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          cat > NOTES.md <<'NOTES'
          Unofficial VSCodroid — latest APK, build 19.
          
          Requires Android 13+ and ARM64. Package: com.vscodroid.codexpaste.
          
          Codex starts successfully, GPT-6.1 Sol appears in the model picker, and files/images can be attached with the + button. Clipboard image paste remains unresolved; use + to attach screenshots.
          
          Force-stop other VSCodroid apps before opening this app. Install Codex extension 26.908.40401, disable its automatic updates, and sign in.
          
          Includes Codex backend 0.162.1 and the WebView thread-crash fix. APK build, unit tests, lint, signature, integrity and ARM64 backend checks passed.
          
          SHA256: cc04959d7ce0ee9b83d7511075569796e8d3a0374f8e7fef5328bc9fe233a9db
          
          Source: https://github.com/faizeranoyodev/VSCodroid/tree/8950b3a592dadacacf364fa0e429d990748c66ff
          Original project: https://github.com/rmyndharis/VSCodroid
          NOTES
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --title 'VSCodroid — latest APK (build 19)' --notes-file NOTES.md --prerelease=false --latest
      - name: Verify final download inventory
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > releases.json
          python3 - <<'PY'
          import json
          releases = json.load(open('releases.json'))
          assert len(releases) == 1, 'Expected one downloadable release'
          release = releases[0]
          assert release['tag_name'] == 'codex-paste-fix-test'
          assert not release['prerelease'] and not release['draft']
          assert [a['name'] for a in release['assets']] == ['VSCodroid-codex-paste-fix.apk']
          assert release['assets'][0]['digest'] == 'sha256:cc04959d7ce0ee9b83d7511075569796e8d3a0374f8e7fef5328bc9fe233a9db'
          print('PASS: one release, one verified APK')
          PY
